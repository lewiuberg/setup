# SSH / GPG key restoration.
# This file declares which key files are EXPECTED to exist after a fresh
# install. The setup tool never contains, generates, or transmits any key
# material — it asks you for a backup source (path, mounted volume,
# 1Password CLI command) and copies into place with correct permissions.

[[item]]
name = "ssh-private"
path = "~/.ssh/id_ed25519"
mode = "0600"
description = "Primary SSH private key"
add_to_keychain = true
default = true

[[item]]
name = "ssh-public"
path = "~/.ssh/id_ed25519.pub"
mode = "0644"
description = "Primary SSH public key"
default = true

[[item]]
name = "ssh-config"
path = "~/.ssh/config"
template = "dotfiles/.ssh/config.template"
description = "SSH client config (rendered from a repo template, safe to commit)"
default = true

[[item]]
name = "gpg-pubring"
path = "~/.gnupg/pubring.kbx"
mode = "0600"
description = "GPG public keyring"
default = true

[[item]]
name = "gpg-private"
path = "~/.gnupg/private-keys-v1.d"
mode = "0700"
description = "GPG private key directory"
default = true

[git-signing]
enable = true
# When enabled, the section runs:
#   git config --global commit.gpgsign true
#   git config --global gpg.program $(which gpg)
# and prompts for the signing key ID (from `gpg --list-secret-keys`).

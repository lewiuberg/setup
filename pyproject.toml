[project]
name = "macsetup"
version = "0.1.0"
description = "Wizard-driven macOS dev-environment setup"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85",
    "jinja2>=3.1",
]

[project.scripts]
macsetup = "macsetup.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macsetup"]

[tool.hatch.build.targets.wheel.force-include]
"src/macsetup/templates" = "macsetup/templates"
"src/macsetup/ui/dark_plus.tcss" = "macsetup/ui/dark_plus.tcss"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
